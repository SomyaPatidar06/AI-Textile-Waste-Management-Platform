services:
  # ========================================================
  # Database Service (PostgreSQL 16)
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: textile_waste_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-textile_waste}
      POSTGRES_USER: ${POSTGRES_USER:-textile_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-textile_admin} -d ${POSTGRES_DB:-textile_waste}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - textile_net

  # ========================================================
  # Backend API & AI Inference Engine
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: textile_waste_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-textile_admin}:${POSTGRES_PASSWORD:-change_me_in_production_2026}@postgres:5432/${POSTGRES_DB:-textile_waste}
      SECRET_KEY: ${SECRET_KEY:-prod_jwt_secret_must_be_set_in_env_file_2026}
      BACKEND_CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://127.0.0.1", "http://127.0.0.1:80"]'
      UPLOAD_DIR: /app/uploads
      MATERIAL_MODEL_VERSION: "v1.0-uncalibrated-option-b"
      DEFECT_MODEL_VERSION: "v1.0-provisional-0.45"
      DEFECT_CONFIDENCE_THRESHOLD: 0.45
      AI_UNCERTAINTY_MARGIN: 0.20
      AI_UNCERTAINTY_ENTROPY: 0.70
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_backups:/app/backups
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - textile_net

  # ========================================================
  # Frontend Application & Reverse Proxy
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: textile_waste_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - textile_net

volumes:
  postgres_data:
    name: textile_postgres_data
  backend_uploads:
    name: textile_backend_uploads
  backend_backups:
    name: textile_backend_backups

networks:
  textile_net:
    name: textile_internal_network
    driver: bridge
